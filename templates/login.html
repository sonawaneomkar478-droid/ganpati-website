<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>श्री गणेश दर्शन व वर्गणी संकलन पोर्टल</title>
    <link href="https://fonts.googleapis.com/css2?family=Khand:wght@500;600;700&family=Outfit:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* Divine Background Mandap */
        .divine-background {
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            position: relative;
            overflow-x: hidden;
            background: radial-gradient(circle at center, #8b0000 0%, #4a0000 60%, #1a0000 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 0.9rem;
            perspective: 1000px;
        }

        {% if settings.entrance_photo_url %}
        .divine-background::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url('{{ settings.entrance_photo_url }}');
            background-size: cover;
            background-position: center;
            opacity: 0.35;
            filter: blur(2px);
            z-index: 0;
        }
        {% endif %}

        /* Darkening overlay gradient */
        .divine-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(139, 0, 0, 0.65) 0%, rgba(30, 0, 0, 0.85) 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* Flower Shower Canvas */
        #flowerCanvas {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 3;
        }

        /* Glowing Divine Sun Rays / Aura */
        .divine-aura {
            position: absolute;
            width: 650px;
            height: 650px;
            background: radial-gradient(circle, rgba(255, 183, 3, 0.45) 0%, rgba(255, 69, 0, 0.25) 45%, transparent 70%);
            border-radius: 50%;
            animation: pulseAura 4s ease-in-out infinite alternate;
            z-index: 2;
            pointer-events: none;
        }

        @keyframes pulseAura {
            0% { transform: scale(0.9); opacity: 0.7; }
            100% { transform: scale(1.15); opacity: 1; }
        }

        /* Animated Temple Diya / Lamp Flames */
        .diya-container {
            position: fixed;
            bottom: 20px;
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            padding: 0 5%;
            z-index: 4;
            pointer-events: none;
        }

        .diya {
            font-size: 3rem;
            filter: drop-shadow(0 0 18px #ffb703);
            animation: diyaFlicker 1.5s ease-in-out infinite alternate;
        }

        @keyframes diyaFlicker {
            0% { transform: scale(1) rotate(-3deg); opacity: 0.9; }
            100% { transform: scale(1.12) rotate(3deg); opacity: 1; }
        }

        /* Divine Floating Glass Window Modal */
        .divine-window {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            margin: auto 0;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 28px;
            border: 3.5px double #ffb703;
            box-shadow: 
                0 0 45px rgba(255, 183, 3, 0.55),
                0 25px 65px rgba(0, 0, 0, 0.85);
            padding: 2.2rem 1.8rem;
            text-align: center;
            animation: windowAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes windowAppear {
            0% { opacity: 0; transform: translateY(40px) scale(0.92); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .ganpati-idol-header {
            width: 95px;
            height: 95px;
            background: linear-gradient(135deg, #ff4500, #ffb703);
            border-radius: 50%;
            margin: 0 auto 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            box-shadow: 
                0 0 25px rgba(255, 183, 3, 0.8),
                0 8px 20px rgba(255, 69, 0, 0.4);
            border: 3px solid #ffffff;
            animation: floatIdol 3s ease-in-out infinite alternate;
        }

        @keyframes floatIdol {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }

        .divine-title {
            font-family: 'Khand', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: #880e4f;
            line-height: 1.15;
            margin-bottom: 0.2rem;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .divine-subtitle {
            font-size: 0.95rem;
            color: #d84315;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .btn-enter-darshan {
            width: 100%;
            padding: 1.1rem;
            background: linear-gradient(135deg, #d84315, #b71c1c);
            color: #ffffff;
            border: none;
            border-radius: 16px;
            font-size: 1.25rem;
            font-weight: 700;
            font-family: 'Khand', sans-serif;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(216, 67, 21, 0.45);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-enter-darshan:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(216, 67, 21, 0.6);
            background: linear-gradient(135deg, #ff4500, #d84315);
        }
    </style>
</head>
<body>

    <div class="divine-background">
        
        <!-- Overlay Gradient -->
        <div class="divine-overlay"></div>

        <!-- Divine Aura Rays -->
        <div class="divine-aura"></div>

        <!-- Falling Flowers Canvas -->
        <canvas id="flowerCanvas"></canvas>

        <!-- Side Diyas -->
        <div class="diya-container">
            <div class="diya">🪔</div>
            <div class="diya">🪔</div>
        </div>

        <!-- Divine Window Modal -->
        <div class="divine-window">
            
            <div class="ganpati-idol-header">
                🐘
            </div>

            <div style="font-size: 0.9rem; color: #d84315; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px;">
                {{ settings.entrance_shloka or '🚩 ॐ गं गणपतये नमः 🚩' }}
            </div>

            <h1 class="divine-title">
                {{ settings.mandal_name or 'श्री गणेशोत्सव मित्र मंडळ, पुणे' }}
            </h1>
            
            <p class="divine-subtitle">
                {{ settings.tagline or 'वर्गणी संकलन व ऑनलाईन डिजिटल पावती प्रणाली २०२६' }}
            </p>

            {% if error %}
                <div style="background: #fee2e2; border: 1px solid #f87171; color: #991b1b; padding: 10px; border-radius: 12px; margin-bottom: 1.2rem; font-size: 0.9rem;">
                    ⚠️ {{ error }}
                </div>
            {% endif %}

            <form action="/login" method="POST" id="loginForm">
                <div class="input-group" style="text-align: left;">
                    <label for="mobile" style="display: block; text-align: center; color: #880e4f; font-weight: 800; margin-bottom: 0.5rem; font-size: 1.05rem;">
                        🚩 दर्शन, डिजिटल पावती व लॉगिनसाठी मोबाईल नंबर टाका:
                    </label>
                    <input type="tel" id="mobile" name="mobile" class="nova-input" placeholder="उदा. 9876543210" required pattern="[0-9]{10}" style="font-size: 1.25rem; text-align: center; letter-spacing: 3px; font-weight: 700; border-color: #ffb703; background: #fffcf7;">
                </div>

                <button type="submit" class="btn-enter-darshan" onclick="ringBellSound()">
                    🚩 पोर्टलमद्धे प्रवेश करा ➔
                </button>
            </form>

        </div>

    </div>

    <!-- Web Audio Synthesizer for Authentic Temple Bell Ring -->
    <script>
        function ringBellSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();

                const now = ctx.currentTime;
                const freqs = [587.33, 880, 1174.66, 1760];
                
                freqs.forEach((freq, index) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now);

                    const vol = 0.3 / (index + 1);
                    gain.gain.setValueAtTime(vol, now);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.5);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(now);
                    osc.stop(now + 2.5);
                });
            } catch(e) {
                console.log("Audio Context initialized on user interaction");
            }
        }

        // Falling Flower Petals & Golden Sparkles Canvas Effect
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const petals = [];
        const sparkles = [];
        const petalColors = ['#ff4500', '#ffb703', '#d84315', '#ff7844', '#ffffff', '#ffd700'];

        for (let i = 0; i < 45; i++) {
            petals.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 8 + 4,
                speedY: Math.random() * 1.5 + 0.8,
                speedX: Math.random() * 1 - 0.5,
                color: petalColors[Math.floor(Math.random() * petalColors.length)],
                angle: Math.random() * 360
            });
        }

        // Magic Golden Touch Sparkle Trail
        function addSparkle(x, y) {
            for (let i = 0; i < 5; i++) {
                sparkles.push({
                    x: x + (Math.random() * 20 - 10),
                    y: y + (Math.random() * 20 - 10),
                    size: Math.random() * 6 + 2,
                    color: petalColors[Math.floor(Math.random() * petalColors.length)],
                    life: 1.0,
                    decay: Math.random() * 0.03 + 0.02,
                    speedX: Math.random() * 2 - 1,
                    speedY: Math.random() * -2 - 0.5
                });
            }
        }

        window.addEventListener('mousemove', (e) => addSparkle(e.clientX, e.clientY));
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                addSparkle(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Petals
            petals.forEach(p => {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate((p.angle * Math.PI) / 180);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.ellipse(0, 0, p.size, p.size / 2, 0, 0, 2 * Math.PI);
                ctx.fill();
                ctx.restore();

                p.y += p.speedY;
                p.x += p.speedX;
                p.angle += 1;

                if (p.y > canvas.height) {
                    p.y = -10;
                    p.x = Math.random() * canvas.width;
                }
            });

            // Draw Magic Touch Sparkles
            for (let i = sparkles.length - 1; i >= 0; i--) {
                const s = sparkles[i];
                ctx.save();
                ctx.globalAlpha = s.life;
                ctx.fillStyle = s.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#ffb703';
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                s.x += s.speedX;
                s.y += s.speedY;
                s.life -= s.decay;

                if (s.life <= 0) {
                    sparkles.splice(i, 1);
                }
            }

            requestAnimationFrame(drawScene);
        }
        drawScene();
    </script>
</body>
</html>
